[project]
name = "mtpy"
version = "0.0.1"
description = "Python port of the Kim Lab magnetic-tweezers tracking and experiment-control program"
requires-python = ">=3.10"
dependencies = ["numpy", "h5py>=3.8"]

[project.optional-dependencies]
fast = ["numba", "rocket-fft"]
gui = ["PySide6", "pyqtgraph"]
real = ["pyserial"]
dev = ["mtpy[fast,gui,real]", "pillow", "pytest", "ruff"]

[project.scripts]
mtpy-gui = "mtpy.gui.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["third_party"]
