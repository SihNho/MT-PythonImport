<text x="40" y="878" class="s" text-anchor="start">P, polarizer; PBS, polarizing beam splitter; L, lens; DM, dichroic mirror; NF, notch filter. Unlabeled black bars are mirrors. Not to scale.</text>
<text x="40" y="896" class="s" text-anchor="start">L1–L2 form an ≈8.6× beam expander; L3 focuses on the objective back focal plane; L3 and the last mirror share a translation stage that sets the TIRF angle.</text>
